name: Release

# Publishes a GitHub release (which HACS picks up) whenever the version in
# manifest.json changes on main. The tag is the bare version (e.g. 1.4.0),
# matching the existing releases. Re-running for a version that already has a
# tag is a no-op, so the workflow can also be started by hand safely.

on:
  push:
    branches: [ main ]
    paths:
      - custom_components/heatit_wifi6/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        run: |
          version=$(jq -r .version custom_components/heatit_wifi6/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version '$version' is not X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check README version history
        run: |
          if ! grep -qF "* **${{ steps.version.outputs.version }}**" README.md; then
            echo "::error::README.md Version History has no entry for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists, nothing to release."
            exit 0
          fi
          prev=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          args=(--target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest)
          [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
          gh release create "$VERSION" "${args[@]}"
